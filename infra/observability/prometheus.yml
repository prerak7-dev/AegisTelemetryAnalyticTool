global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "aegis-collector"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["collector:8000"]

  - job_name: "redpanda"
    metrics_path: "/public_metrics"
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: "clickhouse"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["clickhouse:9363"]
